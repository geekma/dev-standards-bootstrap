# Copy this file as .agent-governance.yml and adapt the paths for the project.
# The shell gate uses the environment variable below so it remains dependency-free.
# NOTE: this is a team-reviewable SUMMARY. The authoritative artifact set is what
# scripts/agent-gate begin enforces (7 non-empty files below); keep both in sync.
change_root: docs/changes
required_before_source_write:
  - 00-intent.md
  - 00-governance.json
  - 01-spec.md
  - 02-code-impact-analysis.md
  - 03-modification-plan.md
  - 03.5-tasks.md
  - 04-test-scripts.md
required_before_merge:
  - 04.5-coding-record.md
  - 05-test-results.md
  - 09-changelog.md
ci:
  # The gate reads THIS command as a fallback (env AGENT_GUARD_VERIFY_COMMAND
  # wins). bootstrap auto-detects a project test command and replaces the
  # placeholder; edit freely — never leave the placeholder if you want stop/ci
  # to run your tests.
  verification_command: "<replace-with-project-test-command>"
stop_hook:
  # Set AGENT_GUARD_VERIFY_COMMAND in a client adapter when a fast deterministic
  # test command is safe to run at the end of every agent turn.
  verification_command_environment_variable: AGENT_GUARD_VERIFY_COMMAND
