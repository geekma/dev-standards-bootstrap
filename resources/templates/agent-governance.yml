# Copy this file as .agent-governance.yml and adapt the paths for the project.
# NOTE: this is a team-reviewable SUMMARY. The authoritative artifact set is what
# scripts/agent-gate begin enforces (7 non-empty files below); keep both in sync.

# ── 路径配置（v3.15.0）────────────────────────────────────────────────────────
# 只配置**目录根**。每个键的默认值 = 历史写死值，因此**不写这一段与写默认值
# 完全等价**——未配置的仓库行为与升级前逐字节一致（零回归）。
#
# 解析优先级：环境变量 AGENT_GUARD_<KEY>_DIR > 本文件 > 内置默认。
# 读取方：scripts/agent-gate、scripts/new-change、
#         scripts/check-standards-compliance.sh、tests/audit-docs-consistency.sh、
#         scripts/stamp-provenance.sh（另读 `provenance.include_email`）。
#         （scripts/bootstrap.sh 是**安装期写入方**，它不随本包下发到目标仓库——
#          本注释里的路径均指目标仓库内的落点，不是 Skill 源仓的路径。）
# 安装期替换：非默认根会同步改写模板**内部**的路径引用（hooks/adapter 按路径
#         调门禁、workflows 与规范模板按路径引用文档），运行时零成本。
#
# ⚠️ 以下**刻意不可配置**：
#    · `.github/`——GitHub Actions 只从 `.github/workflows/` 读 workflow、
#      只从 `.github/` 或仓库根读 PR 模板；换名即流水线静默失效，做成旋钮是假的。
#    · 契约名：`AGENTS.md` 文件名、`scripts/agent-gate` 落点名、变更 15 件产物名（v3.52.0 起）
#      缺陷六件套名、required-check 名 `agent-governance`。它们一旦随仓库而异，
#      跨仓逐文件比对与"装一次、迁移到任意仓库"
#      这一核心能力即失效——参数化目录根是便利，参数化契约名是解体。

# ── 基建冒烟门（v3.71.0，CHG-046，REQ-1088，GATE-E111 fail-closed）──────────
# smoke_command：项目提交前冒烟命令（基建/配置面变更被 staged/stop 捕获时必须
#   已声明，否则拦；命令产物以「冒烟证据」行落 05-test-results.md）。
# smoke_paths：可选，逗号分隔 ERE，覆写默认触发面
#   （pom/build.gradle/application*.yml|.env*|Dockerfile|docker-compose|Makefile；
#   启动脚本面如 `\.sh$` 由项目按需声明）；非法正则即 GATE-E111 拦截（fail-closed）。
# 证据/豁免扫描面：限当前活跃变更 05-test-results.md 单文件（active-change 指针，
#   v3.71.0 erratum CHG-093）；指针缺失 fail-open 放行并 stderr 提示，历史变更行不放行。
# smoke_evidence_max_age_h：可选，证据时效窗小时数（默认 24；0=关窗，仅查存在）。
# smoke_command: bash scripts/build.sh && bash scripts/smoke.sh
# smoke_paths: \.sh$,pom\.xml

# ── 定向验证遥测（v3.73.0，CHG-096，REQ-1102，黄灯软执法）──────────────────────
# full_test_patterns：可选，逗号分隔「锚定全量形态」ERE 列表（首尾锚定，如
#   ^<runner> test$，按项目测试命令方言逐条声明，含变体的形态不要声明过宽）；
#   不声明=关闭（不声明不执法）。声明后 session-gate 对 LLM bash 直跑全量的调用
#   计数（full_suite），达阈值 AGENT_GUARD_FULL_TEST_LIMIT（默认 2）亮黄灯并要求
#   09「重要上下文」登记；门禁/CI 触发的全量不经 LLM bash turn，天然豁免；
#   非法正则该条跳过（fail-open）。判定口径唯一权威=session-gate.sh 头注释。
# full_test_patterns: ^mvn test$|^npm test$|^cargo test$
paths:
  docs: docs            # 文档根：规范/方法论/变更/缺陷/交付总结都挂在此下
  scripts: scripts      # 治理脚本根：agent-gate、install-hook-adapter、合规检查
  tests: tests          # 测试与审计脚本根：run-tests.sh、audit-docs-consistency.sh
  githooks: .githooks   # Git Hook 根：pre-commit、pre-push、commit-msg（随 core.hooksPath 生效）

# 变更轨 / 缺陷轨根。默认由 paths.docs 派生（<docs>/changes、<docs>/bugs）；
# 显式写在这里可单独覆盖（例如变更轨想放 specs/ 而非 docs/）。env 仍最高优先。
# 变更批次（v3.18.0，规范 §1.1）：**同一天**的多个 L0/L1 变更可改落
# <change_root>/BATCH-YYYYMMDD/ 一个目录——产物**文件名不变**，用 `## <变更号>`
# 小节锚点区分，00-governance.json 写成**一行一个 JSON 对象**；L2/L3 不得入批。
# 这不是配置键，只是布局约定：独立 <变更号>/ 目录永远优先，故不建批次即零影响。
change_root: docs/changes
bugs_root: docs/bugs

required_before_source_write:
  - 00-intent.md
  - 00-governance.json
  - 01-spec.md
  - 02-code-impact-analysis.md
  - 03-modification-plan.md
  - 03.5-tasks.md
  - 04-test-scripts.md
required_before_merge:
  - 04.5-coding-record.md   # stop/ci 另检：必须携带脚本生成的 `<!-- provenance -->` 块
  - 05-test-results.md
  - 09-changelog.md         # stop/ci 另检：必须含 ReAct `Observation` 记录
  - 06.5-deployment-config.md   # 未命中也要在行首声明「未命中，不适用」
  - 06-delivery-summary.md      # 须含 FU- 遗留项行（或「遗留」节）
# CHG-017 ④（v3.21.2）：上列 5 件 = `validate_delivery` 的实检集（v3.21.2 与门禁对齐；此前只列 3 件，
# 漏了 06.5 / 06-delivery-summary 与三项内容校验）。`required_before_source_write`
# 的 8 件 = `begin` 的实检集。本文件是**团队可复核的摘要**，判定仍以门禁为准。
ci:
  # The gate reads THIS command as a fallback (env AGENT_GUARD_VERIFY_COMMAND
  # wins). bootstrap auto-detects a project test command and replaces the
  # placeholder; edit freely — never leave the placeholder if you want stop/ci
  # to run your tests.
  #
  # 条款承载面：方言与四态（v3.76.0，CHG-100，REQ-1115~1120）——本注释是方言声明的
  # 唯一权威载体（DS §2.17 该条只留口径与指针）。
  # 方言（v3.76.0）：只支持**标量**，且是以下声明的形态（越界即 GATE-E118 硬拒，
  # 不静默跳过）：双引号 "…"（含 \\ \" \n）、单引号 '…'（'' 转义）、裸标量
  # （行尾 ` # 注释` 会被剥掉）、块标量 | 或 >（含 - / + 裁剪）。推荐写成一行：
  # 多行命令请用块标量 | 或 >，或用 `bash -lc "…"` 单行包裹。
  # **位置**：只认本 `ci:` 段内、与其它 ci 子键同缩进的 `verification_command`；
  # 顶层、别的段（如 stop_hook）、别的键的块正文里的同名键一律 unparsable（拒），
  # 多行裸标量（裸值下一行再缩进续写）同样拒——这些形态**不会**被静默忽略。
  # 块正文里的同名行严格说不是 YAML 键，但同样按 misplaced 拒：挡住"看起来配了
  # 却没生效"的静默形态（本条款的立意）。
  # 四态可见：absent（未声明）/ placeholder（仍是本占位符）/ tampered（本文件在
  # 在途变更中被改动，anti-tamper 生效）/ unparsable（值或位置非法→拒）。
  # 现测：`<scripts>/agent-gate verify-channel`；最近一次判定见
  # `.agent-state/verify-channel.json` 与 `session-gate status` 的「验证通道」行。
  # 在途维护路径：本文件随变更在途时，用 AGENT_GUARD_VERIFY_COMMAND 并在 09
  # 「重要上下文」登记（状态 tampered+env），不得为了跳过 anti-tamper 而回退方言。
  # 并行建议（v3.78.0，CHG-102，REQ-1136）：runner 支持节级并行时，验证命令可写并行
  # 形态（示例 `bash tests/run-tests.sh -j 4`：节级池 + 串行链分离，实测 807s→227s）。
  # 小内存机器下调 `-j 2`；并发数只改墙钟，不改判定结果与收据语义。
  verification_command: "<replace-with-project-test-command>"
stop_hook:
  # Set AGENT_GUARD_VERIFY_COMMAND in a client adapter when a fast deterministic
  # test command is safe to run at the end of every agent turn.
  verification_command_environment_variable: AGENT_GUARD_VERIFY_COMMAND

# ── 文件溯源（v3.17.0）────────────────────────────────────────────────────────
# scripts/stamp-provenance.sh 把「谁 / 哪台机器 / 什么时候」写进变更产物的
# `<!-- provenance -->` 块：author / email / committer / commit / host / platform /
# generated_at。**真值由脚本从运行环境读取**（git 配置与提交者、hostname、
# uname、UTC 时间），手写改不出这些值——所以 agent-gate 会校验块存在、字段齐全、
# 且 generated_by 指向本脚本（手工填的块过不了门禁）。
provenance:
  # 隐私开关：false 时 email 写为 <redacted>，作者与主机信息保留。
  include_email: true
