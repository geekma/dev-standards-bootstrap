# Artifact pipeline: 传动机制（artifact-driven handoff）
#
# 设计原则（对应规范 §2.17.1）：
#   1. 产物被接受即触发下一阶段——01-spec.md 合入 main 后，自动为该变更创建
#      02-code-impact-analysis.md、03-modification-plan.md、03.5-tasks.md 与
#      04-test-scripts.md **骨架** 并开 PR 派发影响分析/方案/测试角色（阶段顺序
#      01→02→03→03.5→04）；09-changelog.md 合入后自动创建发布检查单 issue（§2.7.1 六项）。
#   2. 只创建"骨架"（单源复制自 <docs>/templates/entry/），绝不臆造项目特定内容；
#   3. 一切经 PR/issue 走人工或 Agent 审查，不绕过任何治理门禁（CI 仍是信任边界）；
#   4. 确定性触发：基于 git diff 路径规则与配置的 change_root，不含自然语言判断。
#   5. v4.5.1（CHG-150）：淘汰四份过期内联骨架，改为单源复制 <docs>/templates/entry/；
#      PUSH_BEFORE_SHA 经 env 隔离注入；支持可配置 paths.docs 与 change_root
#      （方法论路由详见 resources/methodologies/state-trigger-audit.md）。

name: Artifact pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: artifact-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch follow-up artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect newly merged change artifacts
        id: detect
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          docs_dir=$(sed -nE '/^paths:[[:space:]]*$/,/^[^[:space:]#]/s/^[[:space:]]+docs:[[:space:]]*([^#]*).*$/\1/p' .agent-governance.yml 2>/dev/null | head -n 1 | tr -d "[:space:]\"'" || true)
          docs_dir="${docs_dir:-docs}"
          change_root=$(sed -nE "s/^[[:space:]]*change_root:[[:space:]]*([^#]*).*$/\1/p" .agent-governance.yml 2>/dev/null | head -n 1 | tr -d "[:space:]\"'" || true)
          change_root="${change_root:-$docs_dir/changes}"
          echo "docs_dir=$docs_dir" >> "$GITHUB_OUTPUT"
          echo "change_root=$change_root" >> "$GITHUB_OUTPUT"
          base="$PUSH_BEFORE_SHA"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] \
             || ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          git diff --name-only --diff-filter=A "${base}..HEAD" -- "${change_root}/*/01-spec.md" \
            | sed 's|/01-spec\.md$||' | xargs -r -n1 basename > /tmp/new-specs.txt
          git diff --name-only --diff-filter=A "${base}..HEAD" -- "${change_root}/*/09-changelog.md" \
            | sed 's|/09-changelog\.md$||' | xargs -r -n1 basename > /tmp/new-changelogs.txt
          echo "specs=$(wc -l < /tmp/new-specs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "changelogs=$(wc -l < /tmp/new-changelogs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Scaffold impact, plan and test scripts for accepted specs
        if: steps.detect.outputs.specs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCS_DIR: ${{ steps.detect.outputs.docs_dir }}
          CHANGE_ROOT: ${{ steps.detect.outputs.change_root }}
        run: |
          set -eu
          tpl_dir="${DOCS_DIR}/templates/entry"
          while read -r id; do
            [ -n "$id" ] || continue
            branch="automation/${id}-scaffold"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "skip $id: scaffold branch already exists"
              continue
            fi
            git checkout -b "$branch"
            mkdir -p "${CHANGE_ROOT}/$id"
            # Canonical target artifacts (default docs/changes/$id/02-code-impact-analysis.md,
            # docs/changes/$id/03-modification-plan.md, docs/changes/$id/03.5-tasks.md,
            # docs/changes/$id/04-test-scripts.md when change_root is docs/changes).
            for f in 02-code-impact-analysis.md 03-modification-plan.md 03.5-tasks.md 04-test-scripts.md; do
              dst="${CHANGE_ROOT}/$id/$f"
              src="${tpl_dir}/$f"
              if [ ! -s "$dst" ]; then
                if [ -s "$src" ]; then
                  sed -e "s|__CHANGE_ID__|${id}|g" -e "s|__RISK__|L2|g" "$src" > "$dst"
                else
                  echo "artifact-pipeline: missing single-source entry template: $src" >&2
                  exit 2
                fi
              fi
            done
            if git diff --quiet && [ -z "$(git status --porcelain -- "${CHANGE_ROOT}/$id")" ]; then
              echo "skip $id: scaffolds already present"
              git checkout "$DEFAULT_BRANCH"
              continue
            fi
            git add "${CHANGE_ROOT}/$id"
            git commit -m "chore(pipeline): scaffold impact/plan/test artifacts for $id"
            git push origin "$branch"
            gh pr create --title "pipeline: scaffold artifacts for $id" --body \
              "由 01-spec.md 合入自动派发（传动机制，规范 §2.17.1）。请由影响分析/方案/测试角色填写 02、03、03.5 与 04（gate begin 必检八件），经门禁 1（需求/设计先行）审查后合入。骨架复制自单源入口模板。"
            git checkout "$DEFAULT_BRANCH"
          done < /tmp/new-specs.txt

      - name: Open release checklist issues for merged changelogs
        if: steps.detect.outputs.changelogs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > /tmp/release-checklist.md <<'EOF'
          ## 发布检查单（规范 §2.7.1，全部通过才可发布）

          - [ ] 代码已具备合入条件，09-changelog.md §4 必填字段完整，RTVM / CFG-DB 矩阵闭环（门禁 4），项目总册回填清单逐册勾选（P00–P12，§1.3），并通过独立测试、Review 和必要授权（门禁 5）
          - [ ] 全套件测试通过，证据在 changelog（门禁 3）
          - [ ] 配置/DB 变更已在 06.5-deployment-config.md 记录，且目标环境已应用（§2.6）
          - [ ] AI/LLM：模型/endpoint 目标环境可用性验证通过（§2.9.1）
          - [ ] 监控/告警已配置，且上线冒烟验证观测确实有数据（§2.8）
          - [ ] 回滚预案就绪：代码 tag、配置旧值、DB 回滚脚本（§2.6.2）

          > 本 issue 由 09-changelog.md 合入自动创建（传动机制）。发布动作与冒烟结果须回填 changelog「发布与回滚记录」字段并关闭本 issue。
          EOF
          while read -r id; do
            [ -n "$id" ] || continue
            gh issue create --title "release checklist: $id" --body-file /tmp/release-checklist.md
          done < /tmp/new-changelogs.txt
