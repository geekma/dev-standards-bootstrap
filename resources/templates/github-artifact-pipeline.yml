# Artifact pipeline: 传动机制（artifact-driven handoff）
#
# 设计原则（对应规范 §2.17.1）：
#   1. 产物被接受即触发下一阶段——01-spec.md 合入 main 后，自动为该变更创建
#      03-modification-plan.md 与 04-test-scripts.md **骨架** 并开 PR 派发方案/测试角色；
#      09-changelog.md 合入后自动创建发布检查单 issue（§2.7.1 六项）。
#   2. 只创建"骨架"（标题 + 指向规范必含清单的待填项），绝不臆造项目特定内容；
#   3. 一切经 PR/issue 走人工或 Agent 审查，不绕过任何治理门禁（CI 仍是信任边界）；
#   4. 确定性触发：基于 git diff 路径规则，不含任何自然语言判断。
#
# GitLab 等其他托管平台：等价实现思路是 pipeline on push to default branch +
# 路径过滤规则 + API 创建 MR/issue，规则与本文件一一对应（本模板只为 GitHub 生成配置）。

name: Artifact pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: artifact-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch follow-up artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect newly merged change artifacts
        id: detect
        run: |
          set -eu
          base="${{ github.event.before }}"
          if ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            base=$(git rev-parse HEAD~1)
          fi
          git diff --name-only --diff-filter=A "${base}..HEAD" -- 'docs/changes/*/01-spec.md' \
            | sed 's|/01-spec\.md$||' | xargs -r -n1 basename > /tmp/new-specs.txt
          git diff --name-only --diff-filter=A "${base}..HEAD" -- 'docs/changes/*/09-changelog.md' \
            | sed 's|/09-changelog\.md$||' | xargs -r -n1 basename > /tmp/new-changelogs.txt
          echo "specs=$(wc -l < /tmp/new-specs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "changelogs=$(wc -l < /tmp/new-changelogs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Scaffold plan and test scripts for accepted specs
        if: steps.detect.outputs.specs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          while read -r id; do
            [ -n "$id" ] || continue
            branch="automation/${id}-scaffold"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "skip $id: scaffold branch already exists"
              continue
            fi
            git checkout -b "$branch"
            mkdir -p "docs/changes/$id"
            if [ ! -s "docs/changes/$id/03-modification-plan.md" ]; then
          cat > "docs/changes/$id/03-modification-plan.md" <<'EOF'
          # 03-modification-plan.md（骨架，由传动机制自动创建）

          > 由 01-spec.md 合入自动派发。按 `docs/DEVELOPMENT_STANDARDS.md` §2.5 阶段 3 必含清单填写；本骨架只列待填项，不含任何预生成内容。

          ## 架构设计
          <!-- 分层/模块归属、依赖方向、新增组件 -->

          ## 接口/API 设计
          <!-- 字段表、状态码、错误码、示例报文 -->

          ## 流程设计
          <!-- 时序/流程图：正常流、分支流、异常流、降级流 -->

          ## 数据设计
          <!-- 表结构、索引、缓存策略、事务边界 -->

          ## 技术选型与决策记录（ADR）
          <!-- 为什么选此方案，备选对比 -->

          ## 兼容性与影响
          <!-- 对既有调用方的兼容措施 -->

          ## 任务拆解
          <!-- 03.5-tasks.md 的 T 任务行（或 CHG 直接实施豁免标注） -->
          EOF
            fi
            if [ ! -s "docs/changes/$id/04-test-scripts.md" ]; then
          cat > "docs/changes/$id/04-test-scripts.md" <<'EOF'
          # 04-test-scripts.md（骨架，由传动机制自动创建）

          > 由 01-spec.md 合入自动派发。按 `docs/DEVELOPMENT_STANDARDS.md` §2.5 阶段 4 必含清单填写；测试 Agent 独立性声明（§0.5.2）必须包含。

          ## 测试命令
          <!-- 全量套件命令（JDK/Maven 等） -->

          ## 用例矩阵
          <!-- TC 编号 / 场景 / 输入 / 期望断言 / 覆盖的 REQ-DES；正常流 + 边界 + 异常兜底 -->

          ## TDD 红->绿运行方式
          <!-- 先红后绿的执行步骤 -->

          ## 测试 Agent 独立性声明
          <!-- 执行主体标识（§2.1.7 格式）、与开发主体不同的证明 -->
          EOF
            fi
            if git diff --quiet; then
              echo "skip $id: scaffolds already present"
              git checkout "$DEFAULT_BRANCH"
              continue
            fi
            git add "docs/changes/$id"
            git commit -m "chore(pipeline): scaffold plan/test artifacts for $id"
            git push origin "$branch"
            gh pr create --title "pipeline: scaffold artifacts for $id" --body \
              "由 01-spec.md 合入自动派发（传动机制，规范 §2.17.1）。请由方案/测试角色填写 03 与 04，经门禁 1（需求/设计先行）审查后合入。骨架不含预生成内容。"
            git checkout "$DEFAULT_BRANCH"
          done < /tmp/new-specs.txt

      - name: Open release checklist issues for merged changelogs
        if: steps.detect.outputs.changelogs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > /tmp/release-checklist.md <<'EOF'
          ## 发布检查单（规范 §2.7.1，全部通过才可发布）

          - [ ] 代码已具备合入条件，09-changelog.md §4 必填字段完整，RTVM / CFG-DB 矩阵闭环（门禁 4），并通过独立测试、Review 和必要授权（门禁 5）
          - [ ] 全套件测试通过，证据在 changelog（门禁 3）
          - [ ] 配置/DB 变更已在 06.5-deployment-config.md 记录，且目标环境已应用（§2.6）
          - [ ] AI/LLM：模型/endpoint 目标环境可用性验证通过（§2.9.1）
          - [ ] 监控/告警已配置，且上线冒烟验证观测确实有数据（§2.8）
          - [ ] 回滚预案就绪：代码 tag、配置旧值、DB 回滚脚本（§2.6.2）

          > 本 issue 由 09-changelog.md 合入自动创建（传动机制）。发布动作与冒烟结果须回填 changelog「发布与回滚记录」字段并关闭本 issue。
          EOF
          while read -r id; do
            [ -n "$id" ] || continue
            gh issue create --title "release checklist: $id" --body-file /tmp/release-checklist.md
          done < /tmp/new-changelogs.txt
