# Agent governance workflow (v3.78.0, CHG-102 / REQ-1137).
#
# Structure: two parallel jobs (`governance`, `verify`) plus an aggregator job
# whose name is the required-check contract.
#
#   · the branch-protection required check IS the job named `agent-governance`
#     — keep that name in branch protection; it must not be renamed or made
#     configurable, otherwise protection silently passes while nothing is checked;
#   · both upstream jobs run concurrently (wall-clock ≈ max, not sum);
#   · the aggregator itself does no checkout and no work: it only reads the
#     upstream results, so a cancelled or failed dependency still turns it red.
#
name: Agent governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The diff baseline must come from the event itself, never from a literal
      # branch name: hardcoding the mainline makes repositories whose mainline
      # has another name fail outright, and a fallback to the mainline on push
      # events leaves the diff empty — the gate would then report success while
      # checking nothing. Refuse to run instead of running a no-op gate.
      - name: Resolve diff baseline
        id: baseline
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE_REF" ]]; then
            echo "ref=origin/$PR_BASE_REF" >> "$GITHUB_OUTPUT"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "ref=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "agent-governance: cannot determine a diff baseline for this event; refusing to run a no-op gate." >&2
            exit 2
          fi
      - name: Verify change-governance artifacts
        run: scripts/agent-gate --stage ci --base "${{ steps.baseline.outputs.ref }}"

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run deterministic project verification
        env:
          AGENT_GUARD_VERIFY_COMMAND: ${{ vars.AGENT_GUARD_VERIFY_COMMAND }}
        run: |
          test -n "$AGENT_GUARD_VERIFY_COMMAND" || {
            echo "Set repository variable AGENT_GUARD_VERIFY_COMMAND to the build/lint/test/security command." >&2
            exit 1
          }
          bash -lc "$AGENT_GUARD_VERIFY_COMMAND"

  # Required-check aggregator: no checkout, no work — only the verdict.
  agent-governance:
    name: agent-governance
    needs: [governance, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate parallel job results
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          failed=0
          for dep in "governance=$GOVERNANCE_RESULT" "verify=$VERIFY_RESULT"; do
            echo "$dep"
            [[ "${dep#*=}" == "success" ]] || failed=1
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "agent-governance: an upstream job did not succeed (failed, cancelled or skipped); failing the required check." >&2
            exit 1
          fi
