name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-case:
    name: Golden-case self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # v3.86.0 (CHG-113): parallel section pool; measured 807s -> 227s (CHG-095).
      AGENT_GUARD_SUITE_JOBS: '4'
      # Wall-time guard: a regression back toward the 15-minute job cap fails loudly
      # instead of silently timing out. Local runs are unaffected.
      AGENT_GUARD_CI_WALL_BUDGET_S: '600'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # v3.87.0 (CHG-115, REQ-1184/1191): the committed baseline is what A3 and both
      # READMEs consume, so a missing/non-numeric one must fail before the suite pays
      # four minutes, not after.
      - name: Suite baseline is committed
        run: |
          source scripts/lib-source-facts.sh
          n=$(sf_baseline_num tests/.suite-baseline)
          [ -n "$n" ] || { echo "::error::tests/.suite-baseline is missing or non-numeric"; exit 1; }
          echo "committed suite baseline: $n"
      - name: Run golden-case suite
        run: |
          start=$SECONDS
          rc=0
          bash tests/run-tests.sh -j "$AGENT_GUARD_SUITE_JOBS" || rc=$?
          elapsed=$((SECONDS - start))
          echo "suite wall-time: ${elapsed}s (budget ${AGENT_GUARD_CI_WALL_BUDGET_S}s)"
          if [ "$elapsed" -gt "$AGENT_GUARD_CI_WALL_BUDGET_S" ]; then
            echo "::error::golden-case suite exceeded the ${AGENT_GUARD_CI_WALL_BUDGET_S}s CI wall budget (${elapsed}s)"
            exit 1
          fi
          exit "$rc"
      # v3.87.0 (CHG-115, REQ-1191): this run is the only place runtime truth is
      # produced, so it is also the place the baseline is hard-checked against the
      # receipt, and the receipt/baselines are rendered into the job summary.
      - name: Baseline vs receipt hard gate
        run: bash scripts/ci-summary.sh --check
      - name: Golden-case run summary
        if: always()
        run: bash scripts/ci-summary.sh
      - name: Upload suite receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: suite-receipt
          path: .agent-state/last-suite-receipt.json
          if-no-files-found: error
          retention-days: 1

  source-audit:
    name: Source-layer audit
    # v3.87.0 (CHG-115): no `needs: golden-case`. The audit reads the COMMITTED
    # baselines only, so it has no dependency on the suite run and can go in
    # parallel — the aggregate job still fails if either one fails. Serialized,
    # this job waited ~4 min for nothing and, worse, reported no audit findings
    # at all whenever the suite was red.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # A3/A3c/A10 consume the COMMITTED baselines (tests/.suite-baseline /
      # tests/.audit-baseline) — hard gates, no AGENT_GUARD_AUDIT_SOFT. The receipt
      # artifact below is kept for human forensics only; the run-time truth gate is
      # the golden-case job's ci-summary --check.
      - name: Validate release carriers
        run: bash scripts/release.sh check
      - name: Run source-layer audit
        run: bash tests/audit-standards-src.sh

  # Stable required-check context for branch protection (scripts/setup-branch-protection.sh
  # defaults to this name). It must fail whenever either real job fails.
  agent-governance:
    name: agent-governance
    needs: [golden-case, source-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both governance jobs must succeed
        run: |
          echo "golden-case: ${{ needs.golden-case.result }}"
          echo "source-audit: ${{ needs.source-audit.result }}"
          [[ "${{ needs.golden-case.result }}" == "success" && "${{ needs.source-audit.result }}" == "success" ]]
